<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Online Payment | MiniCatalogue</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background: #f7f1eb;
            font-family: Arial, sans-serif;
        }

        .payment-card {
            max-width: 600px;
            margin: 70px auto;
            padding: 35px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        .brand {
            color: #c8753e;
            font-weight: bold;
            font-size: 25px;
        }

        .amount {
            font-size: 32px;
            font-weight: bold;
            color: #c8753e;
        }

        .pay-button {
            width: 100%;
            padding: 14px;
            background: #c8753e;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 17px;
            font-weight: bold;
        }

        .pay-button:hover {
            background: #91451f;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="payment-card">

        <div class="text-center mb-4">
            <div class="brand">MiniCatalogue</div>
            <h2 class="mt-3">Online Payment</h2>
            <p class="text-muted">
                Complete your payment securely.
            </p>
        </div>

        <hr>

        <div class="mb-3">
            <strong>Order Number:</strong>
            #{{ order.id }}
        </div>

        <div class="mb-3">
            <strong>Customer:</strong>
            {{ full_name }}
        </div>

        <div class="mb-3">
            <strong>Email:</strong>
            {{ email }}
        </div>

        <div class="mb-3">
            <strong>Phone:</strong>
            {{ phone }}
        </div>

        <div class="text-center my-4">
            <p class="text-muted mb-1">Total Amount</p>

            <div class="amount">
                ₹{{ order.total_amount }}
            </div>
        </div>

        <button type="button"
                id="pay-button"
                class="pay-button">
            Pay ₹{{ order.total_amount }}
        </button>

        <p class="text-muted text-center mt-3 small">
            Available payment methods depend on your Razorpay configuration.
        </p>

        <a href="{% url 'checkout' %}"
           class="btn btn-outline-secondary w-100 mt-2">
            Back to Checkout
        </a>

    </div>

</div>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>

<script>
    const options = {
        key: "{{ razorpay_key_id|escapejs }}",

        amount: "{{ amount }}",

        currency: "{{ currency|default:'INR'|escapejs }}",

        name: "MiniCatalogue",

        description: "Product Purchase",

        order_id: "{{ razorpay_order_id|escapejs }}",

        prefill: {
            name: "{{ full_name|escapejs }}",
            email: "{{ email|escapejs }}",
            contact: "{{ phone|escapejs }}"
        },

        theme: {
            color: "#c8753e"
        },

        handler: function (response) {

            const form = document.createElement("form");

            form.method = "POST";
            form.action = "{% url 'verify_payment' %}";

            const csrf = document.createElement("input");
            csrf.type = "hidden";
            csrf.name = "csrfmiddlewaretoken";
            csrf.value = "{{ csrf_token }}";
            form.appendChild(csrf);

            const fields = {
                razorpay_order_id: response.razorpay_order_id,
                razorpay_payment_id: response.razorpay_payment_id,
                razorpay_signature: response.razorpay_signature
            };

            for (const name in fields) {
                const input = document.createElement("input");

                input.type = "hidden";
                input.name = name;
                input.value = fields[name];

                form.appendChild(input);
            }

            document.body.appendChild(form);
            form.submit();
        },

        modal: {
            ondismiss: function () {
                console.log("Payment window closed.");
            }
        }
    };

    document.getElementById("pay-button").addEventListener("click", function () {

        if (!options.key || !options.order_id) {
            alert("Payment configuration is incomplete.");
            return;
        }

        const rzp = new Razorpay(options);

        rzp.on("payment.failed", function (response) {
            alert(
                "Payment failed: " +
                response.error.description
            );
        });

        rzp.open();
    });
</script>

</body>
</html>
