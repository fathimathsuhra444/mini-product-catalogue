<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Add Product</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f4f6;
        }

        nav {
            background: #111827;
            color: white;
            padding: 20px 7%;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav h2 {
            margin: 0;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
        }

        .container {
            width: 90%;
            max-width: 650px;
            margin: 50px auto;
        }

        .form-box {
            background: white;
            padding: 35px;

            border-radius: 15px;

            box-shadow:
                0 5px 20px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;

            border: 1px solid #d1d5db;
            border-radius: 7px;

            font-size: 16px;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: #4f46e5;
        }

        .button {
            width: 100%;

            margin-top: 25px;

            padding: 14px;

            background: #4f46e5;
            color: white;

            border: none;
            border-radius: 8px;

            font-size: 17px;
            font-weight: bold;

            cursor: pointer;
        }

        .button:hover {
            background: #3730a3;
        }

        .back {
            display: block;
            text-align: center;

            margin-top: 20px;

            color: #4f46e5;
            text-decoration: none;
        }

        .errorlist {
            color: red;
        }

    </style>

</head>


<body>

    <nav>

        <h2>🛍️ Mini Catalogue</h2>

        <div>

            <a href="/">Home</a>

            <a href="/products/">Products</a>

            <a href="/admin/">Admin</a>

        </div>

    </nav>


    <div class="container">

        <div class="form-box">

            <h1>➕ Add New Product</h1>


            <form method="POST"
                  enctype="multipart/form-data">

                {% csrf_token %}

                {{ form.as_p }}

                <button
                    type="submit"
                    class="button">

                    ➕ Add Product

                </button>

            </form>


            <a
                class="back"
                href="/products/">

                ← Back to Products

            </a>

        </div>

    </div>

</body>

</html>
