<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Delete Product | MiniCatalogue</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f7f1eb;
            font-family: Arial, sans-serif;
        }

        .delete-card {
            width: 100%;
            max-width: 480px;
            padding: 35px;
            background: #ffffff;
            border-radius: 18px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.10);
            text-align: center;
        }

        .warning-icon {
            width: 75px;
            height: 75px;
            margin: 0 auto 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #fff0ed;
            border-radius: 50%;
            color: #c0392b;
            font-size: 38px;
        }

        h2 {
            color: #493023;
            font-weight: 700;
            margin-bottom: 15px;
        }

        .product-name {
            color: #c8753e;
            font-weight: 700;
            overflow-wrap: anywhere;
        }

        .description {
            color: #777;
            line-height: 1.7;
        }

        .btn-delete {
            background: #c0392b;
            color: white;
            border: none;
        }

        .btn-delete:hover {
            background: #962d22;
            color: white;
        }

        .btn-cancel {
            background: #eee5de;
            color: #493023;
            border: none;
        }

        .btn-cancel:hover {
            background: #e2d2c5;
            color: #493023;
        }
    </style>
</head>

<body>

    <div class="delete-card">

        <div class="warning-icon">!</div>

        <h2>Delete Product?</h2>

        <p class="description">
            Are you sure you want to delete this product?
        </p>

        <h5 class="product-name">
            {{ product.name }}
        </h5>

        <p class="description">
            This action cannot be undone.
        </p>

        <form method="POST">
            {% csrf_token %}

            <div class="d-flex justify-content-center gap-3 mt-4 flex-wrap">

                <button type="submit" class="btn btn-delete px-4 py-2">
                    Yes, Delete
                </button>

                <a href="{% url 'products' %}"
                   class="btn btn-cancel px-4 py-2">
                    Cancel
                </a>

            </div>
        </form>

    </div>

</body>
</html>
