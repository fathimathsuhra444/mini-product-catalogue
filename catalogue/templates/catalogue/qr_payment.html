{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>UPI QR Payment</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            text-align: center;
            padding: 40px 15px;
        }

        .payment-box {
            background: white;
            max-width: 400px;
            margin: auto;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px #ddd;
        }

        .qr-image {
            width: 230px;
            height: 230px;
            object-fit: contain;
        }

        .button {
            display: inline-block;
            background: #C8753E;
            color: white;
            padding: 12px 22px;
            text-decoration: none;
            border-radius: 6px;
        }
    </style>
</head>

<body>
    <div class="payment-box">

        <h2>UPI Payment</h2>

        <p>Scan the QR code using your UPI app.</p>

        <img
            src="{% static 'catalogue/upi_qr.png' %}"
            alt="UPI QR Code"
            class="qr-image"
        >

        <p>Use Google Pay, PhonePe, or Paytm.</p>

        <a href="/" class="button">Back to Home</a>

    </div>
</body>
</html>
