<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reset Password</title>
</head>
<body>
    <h2>Create a New Password</h2>

    {% if validlink %}
        <form method="POST">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit">Change Password</button>
        </form>
    {% else %}
        <p>This password reset link is invalid or has expired.</p>
    {% endif %}
</body>
</html>
